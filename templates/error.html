<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error – Notion-iCal</title>
  <style>
    :root { --bg: #f5f5f5; --card: #fff; --primary: #2f81f7; --text: #24292f; --muted: #656d76; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: var(--card); border: 1px solid #d0d7de; border-radius: 8px; padding: 2rem; width: 100%; max-width: 520px; }
    h1 { text-align: center; margin-bottom: .5rem; }
    .subtitle { text-align: center; color: var(--muted); margin-bottom: 1.5rem; }
    .error-detail { background: #ffebe9; color: #82071e; padding: .75rem 1rem; border-radius: 6px; margin-bottom: 1.5rem; word-break: break-word; font-size: .875rem; }
    .btn { display: inline-block; padding: .5rem 1rem; border-radius: 6px; border: 1px solid transparent; font-size: .875rem; cursor: pointer; text-decoration: none; font-weight: 500; }
    .btn-primary { background: var(--primary); color: #fff; }
    .actions { text-align: center; }
  </style>
</head>
<body>
<div class="card">
  <h1>⚠️ Something went wrong</h1>
  <p class="subtitle">An unexpected error occurred while processing your request.</p>
  <div class="error-detail">{{ error }}</div>
  <div class="actions">
    <a href="/" class="btn btn-primary">← Back to Dashboard</a>
  </div>
</div>
</body>
</html>
